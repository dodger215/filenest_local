<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FileNest Privacy</title><body><h1>FileNest Privacy</h1><p>FileNest stores files, captions, categories, and folder codes on the backend server selected in Settings. Preferences and saved folders are stored in SQLite on your device. No account or sign-in is required. Anyone with network access to the server can use its file API.</p></body></html>
