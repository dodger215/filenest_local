  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_settings: ^6.1.1
  http: ^1.6.0
